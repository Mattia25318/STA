<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore KWh</title>
    <style>
    
    body{
      font-family: Arial, sans-serif;
      background-color: rgb(0, 209, 164);
      text-align: center;
      margin-top: 70px;


    }
    input{
        width: 80px;
        padding: 8px;
        margin: 8px 0;


    }
    button {
    padding: 10px 20px;
    background-color: rgb(0, 0, 0);
    color: aliceblue;
    border: none;
    border-radius: 5px;
    cursor: pointer;





    }
    #risultato {
    margin-top: 15px;
    font-weight: bold;


    }


</style>
</head>
<body>
     <h2>Calcolatore kWh</h2> 
 <input type="number" id="watt" placeholder="Potenza in Watt (es. 2000)">
 <input type="number" id="ore" placeholder="Ore d'uso giornaliere">
 <button onclick="calcolaKwh()">Calcola</button>
 <p id="risultato">Consumo: 0 kWh</p>
 <script>
    function calcolaKwh() {
         let watt=
         document.getElementById("watt").value;

         let ore = 
         document.getElementById("ore").value;

         let consumo = (watt * ore) /1000;

         document.getElementById("risultato").innerText =
         "Consumo:" + consumo + "Kwh";





   }



</script>





    

























































    
</body>
</html>
