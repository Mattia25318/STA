<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Verifica Divisibilità</title>
</head>
<body>

    <h2>Verifica Divisibilità tra due numeri</h2>

    <label for="num1">Primo numero: </label>
    <input type="number" id="num1"><br><br>

    <label for="num2">Secondo numero: </label>
    <input type="number" id="num2"><br><br>

    <button onclick="verificaDivisibilita()">Verifica</button>

    <h3 id="risultato"></h3>

    <script>
        function verificaDivisibilita() {
            let a = parseInt(document.getElementById("num1").value);
            let b = parseInt(document.getElementById("num2").value);

            if (isNaN(a) || isNaN(b) || a <= 0 || b <= 0) {
                document.getElementById("risultato").innerText = "Inserisci numeri interi positivi validi!";
                return;
            }

            if (a % b === 0 || b % a === 0) {
                document.getElementById("risultato").innerText = "I numeri sono divisibili tra loro.";
            } else {
                document.getElementById("risultato").innerText = "I numeri NON sono divisibili tra loro.";
            }
        }
    </script>

</body>
</html>
